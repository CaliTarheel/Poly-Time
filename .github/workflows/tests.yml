name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: unittest ${{ matrix.shard }}/8
    # The engine's native backends are embedded Windows binaries and its numbers are pinned to
    # this platform's arithmetic, so the tests run where the model runs.
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-portable.txt
      - name: Install the pinned dependencies
        run: python -m pip install -r requirements-portable.txt
      - name: Run the tests
        run: python -B ci/run_tests.py --shard ${{ matrix.shard }}/8 --results tmp/ci-results-${{ matrix.shard }}.json --logs tmp/ci-logs
      - name: Keep the outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shard }}
          path: |
            tmp/ci-results-${{ matrix.shard }}.json
            tmp/ci-logs/*.log
          if-no-files-found: warn
